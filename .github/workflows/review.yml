name: Review laboratory changes
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Package review source
        run: |
          mkdir -p review
          tar -czf review/source.tar.gz src public docs tests .github README.md index.html package.json package-lock.json requirements.txt tsconfig.json vite.config.ts
          git rev-parse HEAD > review/commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm run build
      - name: Browser dependencies
        run: |
          pip install playwright==1.51.0
          playwright install --with-deps chromium
      - name: Browser smoke and screenshots
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/lab-preview.log 2>&1 &
          python - <<'PY'
          import json, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          time.sleep(3)
          with sync_playwright() as p:
              browser = p.chromium.launch(args=['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'])
              page = browser.new_page(viewport={'width': 1440, 'height': 1000}, device_scale_factor=1)
              errors = []
              page.on('pageerror', lambda error: errors.append(str(error)))
              try:
                  page.goto('http://127.0.0.1:4173/', wait_until='domcontentloaded')
                  step = page.get_by_role('button', name='Un paso', exact=False)
                  step.wait_for(state='visible', timeout=180000)
                  page.wait_for_function("!Array.from(document.querySelectorAll('button')).find(b => b.textContent.includes('Un paso')).disabled")
                  step.click()
                  page.wait_for_function("document.querySelector('.time-overlay')?.textContent.includes('0.02')")
                  page.screenshot(path='review/desktop.png', full_page=True)
                  page.set_viewport_size({'width': 390, 'height': 844})
                  page.wait_for_timeout(500)
                  page.screenshot(path='review/mobile.png', full_page=True)
                  assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth'), 'Horizontal overflow'
                  assert not errors, '\n'.join(errors)
              finally:
                  Path('review/browser-errors.json').write_text(json.dumps(errors, indent=2))
                  page.screenshot(path='review/final-state.png', full_page=True)
                  browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laboratory-review
          path: review/
          retention-days: 14
