name: Review laboratory changes
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Package review source
        run: |
          mkdir -p review
          tar -czf review/source.tar.gz src public docs tests .github README.md index.html package.json package-lock.json requirements.txt tsconfig.json vite.config.ts
          git rev-parse HEAD > review/commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: node --test tests/test_reporting.mjs
      - run: npm run build
      - name: Browser dependencies
        run: |
          pip install playwright==1.51.0
          playwright install --with-deps chromium
      - name: Browser smoke and screenshots
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/lab-preview.log 2>&1 &
          sleep 3
          python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laboratory-review
          path: review/
          retention-days: 14
